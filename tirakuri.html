<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#dff7ef">
  <title>ティラクリ</title>
  <link rel="stylesheet" href="tirakuri.css?v=20260913-2">
</head>
<body>
  <main class="app" id="app">
    <header class="hud" aria-label="ゲーム情報">
      <div class="hud__metric"><span>きょり</span><strong id="distance">0m</strong></div>
      <div class="hud__title">ティラクリ</div>
      <div class="hud__metric hud__metric--right"><span>BEST</span><strong id="best">0m</strong></div>
    </header>
    <div class="letters" id="letters" aria-label="TIRANONコレクション"></div>
    <section class="game-wrap" id="game-wrap">
      <canvas id="game" aria-label="ティラノンがクリをよけながら走るゲーム"></canvas>
      <div class="fever" id="fever" hidden>
        <div class="fever__label">FEVER!</div>
        <div class="fever__bar"><i id="fever-bar"></i></div>
      </div>
      <div class="overlay" id="start-screen">
        <div class="card">
          <div class="logo">🌰 ティラクリ 🌰</div>
          <p>タップでジャンプ<br>空中でもう1回で<strong>2段ジャンプ</strong></p>
          <p class="small">クリをよけて、TIRANONをそろえよう！</p>
          <button id="start-button" type="button">スタート</button>
        </div>
      </div>
      <div class="overlay" id="game-over" hidden>
        <div class="card">
          <div class="result-title">クリにぶつかったノン！</div>
          <div class="result-distance" id="final-distance">0m</div>
          <div class="new-best" id="new-best" hidden>NEW BEST!</div>
          <button id="restart-button" type="button">もう1回</button>
        </div>
      </div>
      <div class="tap-hint" id="tap-hint">TAP = JUMP</div>
    </section>
  </main>
  <script src="tirakuri.js?v=20260913-1"></script>
</body>
</html>
