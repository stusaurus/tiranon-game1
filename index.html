<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Tiranon Adventure</title>
  <link rel="stylesheet" href="style.css?v=20260830-v29">
  <link rel="stylesheet" href="jump-fix.css?v=20260830-v29">
  <link rel="stylesheet" href="combo.css?v=20260830-v29">
  <link rel="stylesheet" href="items.css?v=20260830-v29">
  <link rel="stylesheet" href="item-polish.css?v=20260830-v29">
  <link rel="stylesheet" href="result.css?v=20260830-v29">
  <link rel="stylesheet" href="progression.css?v=20260830-v29">
  <link rel="stylesheet" href="run-levelup.css?v=20260830-v29">
  <link rel="stylesheet" href="life-mode.css?v=20260830-v29">
  <link rel="stylesheet" href="home-mode.css?v=20260830-v29">
  <link rel="stylesheet" href="care-mode.css?v=20260830-v33">
  <link rel="stylesheet" href="care-growth-v2.css?v=20260830-v29">
  <link rel="stylesheet" href="care-prebirth-fix.css?v=20260830-v29">
  <link rel="stylesheet" href="control-touch.css?v=20260830-v29">
  <link rel="stylesheet" href="stage-hazards.css?v=20260830-v29">
</head>
<body>
  <main id="game" class="game" aria-label="Tiranon Adventureのゲーム画面">
    <div class="cloud cloud--one" aria-hidden="true"></div>
    <div class="cloud cloud--two" aria-hidden="true"></div>
    <div class="cloud cloud--three" aria-hidden="true"></div>

    <header class="status">
      <p id="score">SCORE 0</p>
      <h1>Tiranon Adventure</h1>
      <p id="time" class="life-display" aria-label="ライフ5">❤️❤️❤️❤️❤️</p>
    </header>

    <div id="combo" class="combo-display" aria-live="polite" hidden></div>

    <div id="play-area" class="play-area">
      <div id="player" class="player" role="img" aria-label="ティラノン">
        <img id="player-sprite" class="player__sprite" src="IMG_1796.png?v=20260830-v29" width="126" height="126" alt="" draggable="false">
      </div>
    </div>

    <nav class="controls" aria-label="移動とジャンプ操作">
      <button id="left-button" class="control-button control-button--left" type="button" aria-label="左へ移動">
        <span class="footprint footprint--left" aria-hidden="true">
          <span class="footprint__toe footprint__toe--one"></span>
          <span class="footprint__toe footprint__toe--two"></span>
          <span class="footprint__toe footprint__toe--three"></span>
          <span class="footprint__pad"></span>
        </span>
      </button>
      <button id="jump-button" class="jump-button" type="button" aria-label="ジャンプ">
        <span class="jump-mark" aria-hidden="true"></span>
      </button>
      <button id="right-button" class="control-button control-button--right" type="button" aria-label="右へ移動">
        <span class="footprint footprint--right" aria-hidden="true">
          <span class="footprint__toe footprint__toe--one"></span>
          <span class="footprint__toe footprint__toe--two"></span>
          <span class="footprint__toe footprint__toe--three"></span>
          <span class="footprint__pad"></span>
        </span>
      </button>
    </nav>

    <section id="game-over" class="game-over result-screen" aria-live="polite" hidden>
      <div class="result-card">
        <p class="result-label">RESULT</p>
        <div id="result-rank" class="result-rank" aria-label="ランクC">C</div>
        <p id="rank-message" class="rank-message">ナイスチャレンジ！</p>

        <div class="result-scores">
          <div class="result-score-row">
            <span>今回のスコア</span>
            <strong id="final-score">0</strong>
          </div>
          <div class="result-score-row result-score-row--best">
            <span>BEST SCORE</span>
            <strong id="best-score">0</strong>
          </div>
        </div>

        <p id="new-best" class="new-best" hidden>NEW BEST!</p>
        <button id="restart-button" class="restart-button" type="button">もう一度遊ぶ</button>
      </div>
    </section>
  </main>

  <script src="game.js?v=20260830-v29"></script>
  <script src="jump-overrides.js?v=20260830-v29"></script>
  <script src="fever-mode.js?v=20260830-v29"></script>
  <script src="item-mode.js?v=20260830-v29"></script>
  <script src="item-polish.js?v=20260830-v29"></script>
  <script src="result-screen.js?v=20260830-v29"></script>
  <script src="progression.js?v=20260830-v29"></script>
  <script src="run-levelup.js?v=20260830-v29"></script>
  <script src="life-mode.js?v=20260830-v29"></script>
  <script src="home-mode.js?v=20260830-v29"></script>
  <script src="controls-plus.js?v=20260830-v29"></script>
  <script src="stage-hazards.js?v=20260830-v29"></script>
  <script src="care-mode.js?v=20260830-v33"></script>
  <script src="care-growth-v2.js?v=20260830-v34"></script>
  <script src="care-phase-copy.js?v=20260830-v29"></script>
  <script src="care-prebirth-fix.js?v=20260830-v29"></script>
</body>
</html>
